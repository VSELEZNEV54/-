<div class="detail__gallery" data-model-gallery="{{model_id}}">
  <div class="detail__stage">
    <div class="detail__main">
      <img data-gallery-photo src="{{gallery_image}}" alt="{{model_name}} — фото 1 из {{photo_count}}" width="1100" height="733" loading="lazy">
    </div>
    <div class="detail__arrows">
      <button type="button" data-gal="prev" aria-label="Предыдущий ракурс">{{i:arrow-left}}</button>
      <button type="button" data-gal="next" aria-label="Следующий ракурс">{{i:arrow}}</button>
    </div>
  </div>
  <div class="detail__thumbs" role="group" aria-label="Галерея автомобиля">{{thumbs}}</div>
</div>
